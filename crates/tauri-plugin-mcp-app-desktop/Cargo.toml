[package]
name = "tauri-plugin-mcp-app-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Loopback bridge that lets the mcp-app-desktop MCP server drive a Tauri 2 app in development"
license = "MIT"
publish = false

[lib]
name = "tauri_plugin_mcp_app_desktop"

[dependencies]
# `wry` is needed for Webview::with_webview (native screenshot).
tauri = { version = "2", default-features = false, features = ["wry"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
